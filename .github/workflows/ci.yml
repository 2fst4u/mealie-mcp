name: CI

# Runs on pull_request only. A branch push that also has an open PR would
# otherwise trigger this workflow twice for the same commit, doubling the
# matrix. pull_request covers same-repo and fork PRs alike; pushes to main are
# handled by the release workflow (which runs typecheck/build/test).
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
