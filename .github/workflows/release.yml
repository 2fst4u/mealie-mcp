name: Release

on:
  push:
    branches:
      - main
    # Doc-only changes shouldn't cut a release. If a push to main touches ONLY
    # these paths, the whole workflow is skipped — no version bump, no publish.
    # A push that changes any other file still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Trusted Publishing (OIDC) needs `id-token: write`; bumping the version and
# pushing the commit + tag and creating the release need `contents: write`.
# No npm secret/token is required.
permissions:
  contents: write
  id-token: write

# Releases bump the version and push a tag, so two at once would race. Queue
# them instead of running concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, release & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist credentials so we can push the version-bump commit + tag
          # back to main at the end.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1, newer than Node 22 bundles.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Auto-bump the patch version. We update package.json (+ lockfile) in the
      # working tree only — no commit or tag yet — so the build, tests and npm
      # publish all see the new version. The commit + tag are pushed at the very
      # end, only after everything succeeds (see "Commit, tag & push").
      #
      # The next version is derived from the highest existing release *tag*, not
      # from package.json. The bump commit is pushed to main with [skip ci] and
      # can lag main whenever several PRs merge in a burst, so a package.json
      # basis made every queued release compute the same patch and collide on an
      # already-existing tag. Tags are the durable record of what shipped, so
      # basing the bump on them keeps serialized/queued runs strictly monotonic.
      - name: Determine next version
        id: bump
        run: |
          git fetch --tags --force origin
          next() { node -e "const p=process.argv[1].split('.').map(Number);p[2]++;console.log(p.join('.'))" "$1"; }
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          NEXT=$(next "${LATEST:-0.0.0}")
          # Belt-and-braces: skip forward over any patch already taken as a tag or
          # already on npm (e.g. a prior partial run that published without a tag).
          NAME=$(node -p "require('./package.json').name")
          while git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null \
             || npm view "$NAME@$NEXT" version >/dev/null 2>&1; do
            NEXT=$(next "$NEXT")
          done
          npm version "$NEXT" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$NEXT"

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publishes via OIDC Trusted Publishing — no NPM_TOKEN required, and npm
      # generates provenance automatically. Requires a one-time manual first
      # publish plus a Trusted Publisher configured on npmjs.com for this package
      # (repo: 2fst4u/mealie-mcp, workflow: release.yml). See the README.
      #
      # Done before pushing the commit/tag so that a publish failure leaves the
      # repo untouched (the bump only lives in the runner's working tree).
      - name: Publish to npm (Trusted Publishing)
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      # Persist the release in two independent steps, tag first.
      #
      # These used to be one step that committed the bump, rebased it onto the
      # latest main, then tagged and pushed both together. The rebase was there
      # to survive a burst of PR merges queuing several releases, but it cannot:
      # our bump commit and the bump commit of the release ahead of us edit the
      # same "version" line in package.json and package-lock.json, so rebasing
      # one onto the other conflicts every single time. Because the tag was
      # created after the rebase, that conflict took the tag down with it — and
      # the publish had already happened. That is exactly how v0.2.44 reached
      # npm with no tag and no GitHub release behind it.
      #
      # Tagging first fixes the ordering: the tag is the durable record (the
      # next version is derived from it), it cannot race anything because
      # versions are unique, and it names the commit that was actually built and
      # published rather than a bookkeeping commit created afterwards.
      - name: Tag the released commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated: the GitHub release step needs the tag on the remote, and
          # `--follow-tags` only ever pushes annotated tags.
          git tag -a "$TAG" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "$TAG"

      # Record the bump on main. Pushes made with GITHUB_TOKEN do not trigger new
      # workflow runs, and `[skip ci]` is belt-and-suspenders, so this does not
      # start a release loop.
      - name: Push version bump to main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Re-apply the bump onto whatever main is *now* on each attempt, rather
          # than carrying a commit that has to be rebased past someone else's
          # edit to the same lines. Reapplying cannot conflict: we take main's
          # files verbatim and set one field.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset -q --hard origin/main

            CURRENT=$(node -p "require('./package.json').version")
            HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)
            if [ "$CURRENT" = "$VERSION" ] || [ "$HIGHEST" != "$VERSION" ]; then
              # A newer release won the race and already bumped main. Writing
              # ours now would walk main's version backwards.
              echo "::notice::main is at v$CURRENT; leaving it rather than writing v$VERSION over it."
              exit 0
            fi

            npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
            git commit -aqm "chore(release): v$VERSION [skip ci]"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "::notice::main moved while pushing the bump; retrying ($attempt/3)."
          done

          # Deliberately not a failure. The tag and the npm publish have both
          # already succeeded, so the release itself is intact and complete; the
          # version on main is a lagging convenience that the next release
          # rewrites anyway. Failing here would red-flag a release that shipped
          # correctly.
          echo "::warning::Could not push the v$VERSION bump to main after 3 attempts. The tag and the npm publish both succeeded; main's package.json will catch up on the next release."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
